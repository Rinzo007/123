name: Transit Planner web

on:
  push:
    paths:
      - "transit_planner/frontend/**"
  pull_request:
    paths:
      - "transit_planner/frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transit_planner/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: transit_planner/frontend/package.json
      - run: npm install
      - run: npm run build
