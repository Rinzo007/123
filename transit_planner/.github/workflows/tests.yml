name: Transit Planner tests

on:
  push:
    paths:
      - "transit_planner/**"
  pull_request:
    paths:
      - "transit_planner/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transit_planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
