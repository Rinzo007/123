name: Transit Planner CI

on:
  push:
    paths:
      - "transit_planner/**"
      - ".github/workflows/transit-planner-ci.yml"
  pull_request:
    paths:
      - "transit_planner/**"
      - ".github/workflows/transit-planner-ci.yml"

concurrency:
  group: transit-planner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transit_planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[api,test]"
      - run: pytest -q tests

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transit_planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[quality]"
      - run: vulture src tests --min-confidence 80

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transit_planner/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
