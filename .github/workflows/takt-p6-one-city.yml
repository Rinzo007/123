name: Takt P6 one-city JS/JSON pipeline

on:
  push:
    branches: [p6-one-city-berlin-current]

concurrency:
  group: takt-p6-one-city-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  berlin:
    name: Berlin-v5 P6 JS/JSON pipeline
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pinned Takt bundle and city JSON inputs
        run: python scripts/takt_release_gate.py

      - name: Check Python orchestration scripts
        run: python -m compileall -q scripts/takt_city_python_snapshot.py scripts/takt_release_gate.py scripts/takt_differential.py

      - name: Generate Berlin snapshot through Python JS/JSON pipeline
        run: python scripts/takt_city_python_snapshot.py --city=berlin-v5 --sync-browser

      - name: Check city golden schema
        run: python scripts/takt_release_gate.py --check-city-schemas

      - name: Compare Berlin pipeline snapshot with JS golden
        run: |
          python scripts/takt_differential.py \
            tests/fixtures/cities/berlin-v5/takt_browser_snapshot.json \
            tests/fixtures/cities/berlin-v5/takt_python_snapshot.json \
            --section parity \
            --max-diffs 80
