name: Overture tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-overture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy shapely pyarrow
      - name: Compile Python sources
        run: python -m compileall -q overture tests
      - name: Run Overture contract tests
        run: python -m pytest -q
