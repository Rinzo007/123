name: Takt P6 release parity gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: takt-p6-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  city-parity:
    name: Canonical Takt city parity
    strategy:
      fail-fast: false
      matrix:
        city: [amsterdam-v8, berlin-v5, hong-kong-v6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify pinned Takt bundle and city input pins
        run: python scripts/takt_release_gate.py
      - name: Start real city JS golden
        env:
          TAKT_BUNDLE_PATH: scripts/bd956ff0a1875604740f.js
        run: |
          rm -f /tmp/takt-js.done /tmp/takt-js.status /tmp/takt-js.log
          nohup bash -lc 'node scripts/takt_city_browser_snapshot.js --city=${{ matrix.city }} > /tmp/takt-js.log 2>&1; echo $? > /tmp/takt-js.status; touch /tmp/takt-js.done' >/dev/null 2>&1 &
      - name: Wait for real city JS golden
        run: |
          for i in $(seq 1 720); do
            if test -f /tmp/takt-js.done; then
              cat /tmp/takt-js.log
              test "$(cat /tmp/takt-js.status)" = 0
              exit 0
            fi
            sleep 1
          done
          echo "Takt JS golden did not finish within 12 minutes"
          cat /tmp/takt-js.log || true
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install passenger_flow runtime dependencies
        run: python -m pip install numpy scipy pytest
      - name: Start real city Python golden
        run: |
          rm -f /tmp/takt-py.done /tmp/takt-py.status /tmp/takt-py.log
          nohup bash -lc 'python scripts/takt_city_python_snapshot.py --city=${{ matrix.city }} > /tmp/takt-py.log 2>&1; echo $? > /tmp/takt-py.status; touch /tmp/takt-py.done' >/dev/null 2>&1 &
      - name: Wait for real city Python golden
        run: |
          for i in $(seq 1 600); do
            if test -f /tmp/takt-py.done; then
              cat /tmp/takt-py.log
              test "$(cat /tmp/takt-py.status)" = 0
              exit 0
            fi
            sleep 1
          done
          echo "Takt Python golden did not finish within 10 minutes"
          cat /tmp/takt-py.log || true
          exit 1
      - name: Check city golden schema
        run: python scripts/takt_release_gate.py --check-city-schemas
      - name: Compare real city parity
        run: |
          python scripts/takt_differential.py \
            tests/fixtures/cities/${{ matrix.city }}/takt_browser_snapshot.json \
            tests/fixtures/cities/${{ matrix.city }}/takt_python_snapshot.json \
            --section parity \
            --max-diffs 80
      - name: Run parity regression suite
        run: python -m pytest -q tests/test_passenger_flow_takt_parity.py
      - name: Upload city goldens
        uses: actions/upload-artifact@v4
        with:
          name: takt-city-${{ matrix.city }}
          path: tests/fixtures/cities/${{ matrix.city }}
          if-no-files-found: error
          retention-days: 7

  record:
    name: Record verified city goldens
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: city-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Amsterdam golden
        uses: actions/download-artifact@v4
        with:
          name: takt-city-amsterdam-v8
          path: tests/fixtures/cities/amsterdam-v8
      - name: Download Berlin golden
        uses: actions/download-artifact@v4
        with:
          name: takt-city-berlin-v5
          path: tests/fixtures/cities/berlin-v5
      - name: Download Hong Kong golden
        uses: actions/download-artifact@v4
        with:
          name: takt-city-hong-kong-v6
          path: tests/fixtures/cities/hong-kong-v6
      - name: Record verified goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/cities
          git diff --cached --quiet || git commit -m "test: record Takt city golden snapshots"
          git push

  release:
    name: Release-only fail-closed gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: city-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy pytest
      - run: python scripts/takt_release_gate.py --require-city-snapshots --check-city-schemas
