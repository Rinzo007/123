[project]
name = "wikiroutes"
version = "1.0.1"
description = "Анализ и дедупликация маршрутов общественного транспорта"
requires-python = ">=3.14,<3.15"

dependencies = [
    "beautifulsoup4>=4.12",
    "fastkml>=1.0",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "orjson>=3.10",
    "pandas>=2.2",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "requests>=2.32",
    "shapely>=2.1",
]

[project.optional-dependencies]
overture = [
    "geopandas>=1.0",
    "overturemaps>=1.0.1",
    "pyarrow>=18",
]

dev = [
    "mypy>=1.15",
    "pandas-stubs",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-openpyxl",
    "types-requests",
    "types-shapely",
]

[project.scripts]
wikiroutes = "wikiroutes.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wikiroutes", "wikiroutes.overture"]
package-dir = {"wikiroutes" = "."}

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "DTZ",
    "EXE",
    "ISC",
    "ICN",
    "PIE",
    "T20",
    "Q",
    "RSE",
    "RET",
    "ARG",
    "ERA",
    "PGH",
    "TRY",
    "FLY",
    "PERF",
    "RUF",
]

ignore = [
    "E501",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "TRY003",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__main__.py" = ["T201"]
"cli.py" = ["T201"]
"report.py" = ["T201"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "rasterio.*",
    "geopandas.*",
    "overturemaps",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
